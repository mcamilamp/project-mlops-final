version: "3.8"

services:
  # Base de datos PostgreSQL para MLflow
  postgres:
    image: postgres:15-alpine
    container_name: mlflow-db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: ../mlflow
      dockerfile: Dockerfile
    container_name: mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://mlflow:mlflow@postgres:5432/mlflow
      - DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops-net
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --serve-artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mlops-net

  llm-service:
    build:
      context: ../llm-service
      dockerfile: Dockerfile
    container_name: llm-service
    ports:
      - "8001:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=orca-mini
    depends_on:
      - ollama
    networks:
      - mlops-net

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: ml-service
    ports:
      - "8002:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - mlops-net

  cnn-service:
    build:
      context: ../cnn-service
      dockerfile: Dockerfile
    container_name: cnn-service
    ports:
      - "8003:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - mlops-net

  gradio-app:
    build:
      context: ../gradio-app
      dockerfile: Dockerfile
    container_name: gradio-app
    ports:
      - "7860:7860"
    depends_on:
      - llm-service
      - ml-service
      - cnn-service
    networks:
      - mlops-net

networks:
  mlops-net:
    driver: bridge

volumes:
  ollama-data:
  postgres-data:
  mlflow-artifacts:
